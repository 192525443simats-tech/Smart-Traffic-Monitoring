services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-traffic-backend
    ports:
      - "3000:5000"
    volumes:
      - traffic_database:/app/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-traffic-frontend
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  traffic_database: